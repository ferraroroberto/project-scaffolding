# The fleet's CI, nightly on the Mac Mini self-hosted runner: for each adopter
# whose `main` moved since its last green night (every adopter on Sunday), its
# unit suite with Windows-only tests excluded, its WebKit e2e suite (iPhone
# projection) and an iOS Simulator Mobile Safari smoke of its key views.
#
# One hub runner serves the fleet: it is registered on this repo only, and this
# workflow checks out each adopter in turn. The adopter list is
# .github/nightly-adopters.txt; each adopter's settings are the `[ci.nightly]`
# table in its own .fleet.toml, read by scripts/nightly_matrix.py. Setup,
# labels, the table contract and the safety settings: docs/mac-runner.md. The
# per-change contract stays each repo's local gate; this checks what landed on
# `main`.
#
# PUBLIC REPO, SELF-HOSTED RUNNER. A self-hosted runner executes whatever a
# triggering workflow says, so nothing an outsider controls may start it:
#   * triggers are `schedule` and `workflow_dispatch` only (dispatch needs write
#     access); never `pull_request`, `pull_request_target` or `push`;
#   * every job's `if:` refuses any other event, any fork event and any copy of
#     this file running in a fork;
#   * `permissions` is read-only and every checkout drops the token afterwards;
#   * no secret is used: the runner holds only its own registration;
#   * adopter settings reach scripts through `env:`, never as `${{ }}` text
#     inside a `run:` script, and nightly_matrix.py rejects any value outside a
#     conservative character set.
# tests/ci/test_nightly_mac_workflow.py asserts each of these.
#
# RESULTS STAY PRIVATE. Logs of a public repo are public, so the run log and
# the step summary carry pass/fail lines only. Screenshots, traces, junit files
# and flaky test ids go to a folder in the runner user's home on the Mac,
# outside the checkout, and are never uploaded as an artifact. Delivery to the
# owner is pull-only: a trusted host reads a finished run folder (marked READY)
# over SSH. The runner holds no delivery credential, gets no write-back, and the
# only outbound calls are anonymous read-only fetches of public adopters
# (docs/mac-runner.md, "Delivering results").
name: nightly-mac

on:
  schedule:
    # Cron is UTC. 02:00 UTC is 03:00 in Madrid in winter (CET, UTC+1) and
    # 04:00 in summer (CEST, UTC+2): inside the 02:00-05:00 local quiet hours
    # either way, when the hub is not placing whisper jobs on the Mac.
    - cron: "0 2 * * *"
  # A manual run outside the quiet hours slows the Mac's speech-to-text for the
  # seconds its WebKit suite runs (docs/mac-runner.md, "Speech-to-text latency").
  workflow_dispatch:
    inputs:
      full:
        description: "Run every adopter, changed or not (the Sunday behaviour)"
        type: boolean
        default: false

permissions:
  contents: read

# One platform run at a time: the Mac is shared with whisper, and two runs
# would fight over the one simulator.
concurrency:
  group: nightly-mac
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  PYTHONUTF8: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  select:
    if: >-
      github.repository == 'ferraroroberto/project-scaffolding' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      github.event.pull_request.head.repo.fork != true
    runs-on: [self-hosted, macos, arm64, iphone-sim]
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      count: ${{ steps.build.outputs.count }}
    steps:
      - name: Check out the scaffold (matrix script)
        uses: actions/checkout@v6
        with:
          path: scaffold
          persist-credentials: false

      # The scaffold scripts need Python 3.11+ (tomllib); the Mac's own python3 may be older.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # Reads each adopter's main anonymously (a public repo needs no credential)
      # and the last green SHA from the runner's state; writes no file but the
      # matrix output and the step summary.
      - name: Build tonight's matrix (changed repos; every repo on Sunday)
        id: build
        env:
          FULL: ${{ inputs.full }}
        run: >
          python scaffold/scripts/nightly_matrix.py build
          --adopters scaffold/.github/nightly-adopters.txt
          --url-base https://github.com/ferraroroberto/
          --state-root "$HOME/mac-nightly-results"
          --full "${FULL:-false}"
          --github-output "$GITHUB_OUTPUT"
          --summary-file "$GITHUB_STEP_SUMMARY"

  platform:
    needs: select
    if: >-
      github.repository == 'ferraroroberto/project-scaffolding' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      github.event.pull_request.head.repo.fork != true &&
      needs.select.outputs.count != '0'
    runs-on: [self-hosted, macos, arm64, iphone-sim]
    # Cap a wedge: GitHub's default is 6 h, and a wedged run would hold the Mac
    # into the morning. About 4x a typical adopter's full WebKit suite.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    name: ${{ matrix.repo }}
    env:
      REPO: ${{ matrix.repo }}
      SHA: ${{ matrix.sha }}
      STATUS: ${{ matrix.status }}
      REASON: ${{ matrix.reason }}
      REQUIREMENTS: ${{ matrix.requirements }}
      SAMPLES: ${{ matrix.samples }}
      UNIT: ${{ matrix.unit }}
      E2E_ARGS: ${{ matrix.e2e }}
      VIEWS: ${{ matrix.views }}
      EXCLUDE: ${{ matrix.exclude_marker }}
    steps:
      - name: Check out the scaffold (scripts)
        uses: actions/checkout@v6
        with:
          path: scaffold
          persist-credentials: false

      # The scaffold scripts' own Python (3.11+ for tomllib), kept as TOOL_PY
      # because the adopter's setup-python below takes over PATH.
      - uses: actions/setup-python@v6
        id: tools
        with:
          python-version: "3.13"

      - name: Results folder (runner host only, never uploaded)
        # Runs older than 14 days are pruned so failure traces cannot fill the disk.
        env:
          TOOLS_PYTHON: ${{ steps.tools.outputs.python-path }}
        run: |
          root="$HOME/mac-nightly-results/$REPO"
          mkdir -p "$root"
          find "$root" -mindepth 1 -maxdepth 1 -type d -mtime +14 -exec rm -rf {} +
          {
            echo "RESULTS=$root/$GITHUB_RUN_ID"
            echo "STATE=$root/state.json"
            echo "TOOL_PY=$TOOLS_PYTHON"
            echo "FLEET_DATA_ROOT=$RUNNER_TEMP/fleet-data"
          } >> "$GITHUB_ENV"

      # An adopter whose main or table could not be read still gets a run, so
      # its READY says unknown instead of the repo silently dropping out.
      - name: Refuse an unreadable adopter
        if: ${{ matrix.status != 'run' }}
        run: |
          echo "::error::$REPO: $REASON"
          exit 1

      - name: Check out the adopter at the selected commit
        uses: actions/checkout@v6
        with:
          repository: ferraroroberto/${{ matrix.repo }}
          ref: ${{ matrix.sha }}
          path: adopter
          # Full history: the routing audit walks the commits merged since the last green night.
          fetch-depth: 0
          persist-credentials: false

      # setup-python on macOS ignores AGENT_TOOLSDIRECTORY and always installs
      # into /Users/runner/hostedtoolcache, so that folder must exist and be
      # writable for the runner user (docs/mac-runner.md, prerequisite 6).
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Create .venv and install deps
        working-directory: adopter
        run: |
          python -m venv .venv
          ./.venv/bin/python -m pip install --upgrade pip
          reqs=()
          for r in $REQUIREMENTS; do reqs+=(-r "$r"); done
          ./.venv/bin/python -m pip install "${reqs[@]}"
          if [ -n "$E2E_ARGS" ]; then ./.venv/bin/python -m playwright install webkit; fi

      - name: Seed gitignored config from committed samples
        id: seed
        working-directory: adopter
        run: |
          [ -n "$SAMPLES" ] || exit 0
          shopt -s nullglob
          for src in "$SAMPLES"/*.sample.*; do
            dest="${src/.sample./.}"
            [ -e "$dest" ] || cp "$src" "$dest"
          done

      # Failures re-run once (--last-failed): a pass on the retry is flaky, its
      # test ids kept in the run folder; a second failure is red.
      - name: Unit (Windows-only tests excluded, one retry)
        id: unit
        if: ${{ !cancelled() && steps.seed.outcome == 'success' && matrix.unit != '' }}
        run: |
          set +e
          "$TOOL_PY" scaffold/scripts/nightly_matrix.py leg --name unit \
            --python "$PWD/adopter/.venv/bin/python" --cwd adopter \
            --args "$UNIT" --marker "$EXCLUDE" \
            --junit "$RESULTS/unit.xml" --retry-junit "$RESULTS/unit-retry.xml" \
            --flaky-out "$RESULTS/unit-flaky.txt" | tee "$RUNNER_TEMP/unit.log"
          code=${PIPESTATUS[0]}
          set -e
          echo "result=$(tail -n 1 "$RUNNER_TEMP/unit.log" | sed -n 's/^LEG=unit result=\([a-z-]*\).*/\1/p')" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: WebKit e2e (iPhone projection, one retry)
        id: e2e
        # After a red unit leg, still run e2e: each leg reports on its own.
        if: ${{ !cancelled() && steps.seed.outcome == 'success' && matrix.e2e != '' }}
        run: |
          set +e
          "$TOOL_PY" scaffold/scripts/nightly_matrix.py leg --name e2e \
            --python "$PWD/adopter/.venv/bin/python" --cwd adopter \
            --args "$E2E_ARGS --browser webkit --tracing retain-on-failure --screenshot only-on-failure --output $RESULTS/e2e" \
            --retry-args "--output $RESULTS/e2e/retry" \
            --junit "$RESULTS/junit.xml" --retry-junit "$RESULTS/junit-retry.xml" \
            --flaky-out "$RESULTS/e2e-flaky.txt" | tee "$RUNNER_TEMP/e2e.log"
          code=${PIPESTATUS[0]}
          set -e
          echo "result=$(tail -n 1 "$RUNNER_TEMP/e2e.log" | sed -n 's/^LEG=e2e result=\([a-z-]*\).*/\1/p')" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: iOS Simulator Mobile Safari smoke
        id: smoke
        # After a failed e2e, still smoke; after a failed install, there is nothing to boot.
        if: ${{ !cancelled() && steps.seed.outcome == 'success' && matrix.views != '' }}
        run: |
          view_args=()
          for v in $VIEWS; do view_args+=(--view "$v"); done
          set +e
          adopter/.venv/bin/python scaffold/scripts/ios_sim_smoke.py \
            --repo adopter --python "$PWD/adopter/.venv/bin/python" \
            --out "$RESULTS/ios" "${view_args[@]}" | tee "$RUNNER_TEMP/smoke.log"
          code=${PIPESTATUS[0]}
          set -e
          line=$(tail -n 1 "$RUNNER_TEMP/smoke.log")
          {
            echo "line=$line"
            echo "result=$(echo "$line" | sed -n 's/^SMOKE=\([a-z]*\).*/\1/p')"
          } >> "$GITHUB_OUTPUT"
          # Exit 3 is "could not establish a result", its own failing state.
          exit "$code"

      # Audits what per-change routing skipped (docs/mac-runner.md, "Routing audit").
      # Reads the checkout, the junit file and a state file on the runner; writes
      # audit.json in the run folder for the trusted host to file from. No network.
      - name: Routing audit (counts only; node ids stay in the run folder)
        id: audit
        if: ${{ !cancelled() && matrix.status == 'run' && matrix.e2e != '' }}
        env:
          E2E: ${{ steps.e2e.outcome }}
        run: |
          set +e
          python scaffold/scripts/routing_audit.py audit \
            --repo-dir adopter --repo "$REPO" --e2e-outcome "${E2E:-}" \
            --junit "$RESULTS/junit.xml" \
            --state "$HOME/mac-nightly-results/$REPO/audit-state.json" \
            --out "$RESULTS/audit.json" --summary-file "$GITHUB_STEP_SUMMARY" \
            | tee "$RUNNER_TEMP/audit.log"
          code=${PIPESTATUS[0]}
          set -e
          word=$(tail -n 1 "$RUNNER_TEMP/audit.log" | sed -n 's/^AUDIT=\([a-z]*\).*/\1/p')
          echo "result=${word:-unknown}" >> "$GITHUB_OUTPUT"
          # A miss is a finding, not a failed night; unknown (exit 3) stays a failing state.
          [ "$code" -eq 1 ] && exit 0
          exit "$code"

      - name: Summary (pass/fail only; images stay on the runner host)
        if: ${{ !cancelled() }}
        env:
          UNIT_R: ${{ steps.unit.outputs.result || steps.unit.outcome }}
          E2E_R: ${{ steps.e2e.outputs.result || steps.e2e.outcome }}
          SMOKE_R: ${{ steps.smoke.outputs.result || steps.smoke.outcome }}
          SMOKE_LINE: ${{ steps.smoke.outputs.line }}
        run: |
          {
            echo "### $REPO"
            echo "| Leg | Result |"
            echo "|---|---|"
            echo "| Unit (Windows-only excluded) | ${UNIT_R:-not run} |"
            echo "| WebKit e2e (iPhone projection) | ${E2E_R:-not run} |"
            echo "| iOS Simulator smoke | ${SMOKE_R:-not run}: \`${SMOKE_LINE:-no result line}\` |"
            echo
            echo "Screenshots, failure traces and flaky test ids are kept on the runner host, not uploaded."
          } >> "$GITHUB_STEP_SUMMARY"

      # Written last: the pulling host takes a run folder only once READY exists,
      # so it never reads a half-written run. Outcomes and the tested SHA only,
      # no host, path or log. A green night also records the SHA as last green.
      - name: Mark the run folder ready for the trusted puller
        if: ${{ !cancelled() }}
        env:
          UNIT_R: ${{ steps.unit.outputs.result }}
          UNIT_S: ${{ steps.unit.outcome }}
          E2E_R: ${{ steps.e2e.outputs.result }}
          E2E_S: ${{ steps.e2e.outcome }}
          SMOKE_R: ${{ steps.smoke.outputs.result }}
          SMOKE_S: ${{ steps.smoke.outcome }}
          AUDIT: ${{ steps.audit.outputs.result }}
        run: |
          # A plain string, not an array: macOS /bin/bash 3.2 under `set -u` rejects an empty one.
          declared=""
          if [ -n "$UNIT" ]; then declared="$declared,unit"; fi
          if [ -n "$E2E_ARGS" ]; then declared="$declared,e2e"; fi
          if [ -n "$VIEWS" ]; then declared="$declared,smoke"; fi
          "$TOOL_PY" scaffold/scripts/nightly_matrix.py ready \
            --results "$RESULTS" --state "$STATE" --run "$GITHUB_RUN_ID" \
            --repo "$REPO" --sha "$SHA" --status "$STATUS" \
            --declared "$declared" \
            --unit "$UNIT_R" --unit-step "$UNIT_S" \
            --e2e "$E2E_R" --e2e-step "$E2E_S" \
            --smoke "$SMOKE_R" --smoke-step "$SMOKE_S" \
            --audit "$AUDIT"
