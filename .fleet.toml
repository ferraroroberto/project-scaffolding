# .fleet.toml — this repo's card on the fleet architecture map.
# fleet-config's /system-map aggregates every repo's .fleet.toml (schema +
# reasoning: fleet-config/architecture/README.md). Keep it current: update this
# in the same PR as any material change (layer, port, role, description,
# exposed services).
#
# `description` must fit two lines of its map card, so the cap is per layer:
# governance 130, enabling 80, working-web 95, working-pipe 70 characters,
# counted as written (`&amp;` is five). fleet-config's build_data.py refuses a
# longer one by repo name (fleet-config#1250; measurement: its
# architecture/README.md "Description cap"). Aim for one clause; extra detail
# goes in `chips`, `tag` or the README.
#
# CLONED A NEW REPO FROM THIS SCAFFOLD? Replace the values below with your repo's
# own — at minimum `description`, usually `icon`, and `layer` if it is not a
# pipeline (working-pipe). `layer` ∈ governance | enabling | working-web | working-pipe.
layer       = "governance"
icon        = "📐"
description = "Canonical master — the scaffold &amp; CLAUDE.md every project derives from."

# Which canonical tree the root layout is held to (docs/repo-layout.md). A root
# folder the shape does not list goes in `extra_roots = [...]`, with its reason in
# docs/layout.md. Read by scripts/structure_ratchet.py; ids and presets:
# docs/structure-ratchet.md. The scaffold is a streamlit repo with no extra roots.
# A root file the shape does not list goes in `extra_root_files`, each with its reason.
shape            = "streamlit"
extra_roots      = []
extra_root_files = []

# Wide views (fleet-config#1113, design.md Layout): page width follows the shape of a
# view's content, per view. A one-dimensional view (settings, a form, one list, a
# detail) keeps the 772px measure; a two-dimensional one (board lanes, a many-field
# table, a tree with attribute columns, calendar days) may span the window. A web
# app declares those views here, by tab id; an undeclared view keeps the measure.
# fleet-config's design_lint + /design-review read the key. Uncomment and edit:
# [design]
# wide_views = ["board", "table"]

# The scaffold ships a component gallery, not an app shell. demo.html is a
# deliberate 480px phone-width probe: the e2e suite measures overflow and ellipsis
# against that width, so widening it to the 772px measure would break those assertions.
[[design.accepted]]
check  = "desktop-measure"
detail = "no desktop content cap found — spec: centered max-width 772px"
reason = "component gallery harness, no app shell; demo.html is deliberately a 480px phone-width probe that the e2e overflow and ellipsis assertions depend on"

# Nightly CI on the Mac Mini (docs/mac-runner.md, "The [ci.nightly] table"). A
# public repo opts in with this table plus one line in project-scaffolding's
# .github/nightly-adopters.txt; scripts/ci/nightly_matrix.py reads it from `main`
# and refuses unknown keys or values outside a safe character set. The scaffold
# itself has no web app to check, so it is not an adopter. Uncomment and edit:
# [ci.nightly]
# python         = "3.14"
# requirements   = ["requirements.txt", "requirements-dev.txt"]
# samples        = "config"                          # folder of committed *.sample.* config twins
# unit           = ["tests", "--ignore=tests/e2e"]   # pytest arguments; Windows-only tests excluded by marker
# e2e            = ["tests/e2e", "--e2e-autoboot"]   # pytest arguments for the WebKit e2e leg
# views          = ["/"]                             # simulator smoke; needs [design.review.synthetic] command
# exclude_marker = "not windows_only"                # the default
# skip_reason    = "..."                             # instead of the keys above: listed but cannot run here

# Diff-proportionate e2e routing (project-scaffolding#180). scripts/verify-
# before-ship.ps1's browser phase classifies the branch's changed files
# against the rules below (first match wins, in this order) instead of
# always running the whole tests/e2e suite. Schema + rationale:
# docs/e2e-routing.md. Mechanism: scripts/classify_e2e.py. A path matching no
# rule below -- or a repo with no [e2e] table at all -- fails safe to the
# full suite; this table only ever narrows what an *already-covered* diff
# runs, never what an unmatched one runs.
[e2e]
static_pytest_target = "tests/e2e/test_smoke.py"
static_browsers       = ["chromium"]
full_pytest_target    = "tests/e2e"
# Timing source for fleet-config's /e2e-audit: the gate writes this JUnit XML on
# every full-tier browser run and copies a green one to the primary checkout.
junit_xml             = "data/logs/e2e-junit.xml"
# Suite-size ratchet in collected pytest nodes, read by fleet-config's /e2e
# budget step (not classify_e2e.py); adopters set their own count, or omit it
# for the scaffold's default of 15. This repo ratchets at its current 19 nodes,
# one broad contract test per vendored component with no redundancy found;
# lower it as the suite trims.
test_budget           = 19

# Inert image/font assets under the vendored static tree -> smoke is enough.
[[e2e.rule]]
tier       = "static"
prefix     = "app/webapp/static/"
extensions = ["svg", "png", "jpg", "jpeg", "gif", "ico", "webp", "avif", "woff", "woff2", "ttf", "eot", "otf", "webmanifest"]

# The component gallery is NOT an inert fragment: it carries a module script
# and is the page test_vendored_components.py and test_vendored_nav.py drive,
# and it fetches the icon sprite into that page -- so both run the whole suite
# (#258). Must precede the inert-HTML rule below.
[[e2e.rule]]
tier = "full"
path = "app/webapp/static/_vendored/demo.html"
[[e2e.rule]]
tier = "full"
path = "app/webapp/static/_vendored/icons/icons-sprite.html"
# The text-size boot snippet is a <script>, not markup: the component harness
# loads it byte-for-byte into a page's <head> (#276).
[[e2e.rule]]
tier = "full"
path = "app/webapp/static/_vendored/text-size/text-size-boot.html"

# A vendored HTML fragment is pure markup with no behaviour of its own; its
# .css/.js siblings are NOT covered by this rule and fall through to "full"
# below (the component-contract harnesses in tests/e2e/ assert those).
[[e2e.rule]]
tier       = "static"
prefix     = "app/webapp/static/_vendored/"
extensions = ["html"]

# A vendored README is prose beside the component: no browser test reads one.
# Must precede the app/webapp/ rule.
[[e2e.rule]]
tier       = "none"
prefix     = "app/webapp/static/_vendored/"
extensions = ["md"]

# The HTTP/2 launch module is a server process with no browser surface of its own:
# tests/test_serve.py boots it as a real process. Must precede the app/webapp/ rule.
[[e2e.rule]]
tier = "none"
path = "app/webapp/serve.py"

# Real browser surface -> full dual coverage.
[[e2e.rule]]
tier   = "full"
prefix = "app/webapp/"
[[e2e.rule]]
tier   = "full"
prefix = "app/tray/"
[[e2e.rule]]
tier   = "full"
prefix = "app/views/"
[[e2e.rule]]
tier   = "full"
prefix = "app/styles/"
[[e2e.rule]]
tier = "full"
path = "app/app.py"
# The e2e suite itself, and the Streamlit boot helper its conftest relies on.
[[e2e.rule]]
tier   = "full"
prefix = "tests/e2e/"
[[e2e.rule]]
tier = "full"
path = "tests/_streamlit_lifecycle.py"
# ...and the port-to-PID probe that boot helper (and _tray_harness.py) reclaims
# with -- a bad parse here breaks the e2e boot, so it must not route "none"
# just because it lives under tests/ (#208).
[[e2e.rule]]
tier = "full"
path = "tests/_port_probe.py"

# Test support the suite loads from outside tests/e2e/: the root conftest, the
# synthetic host it registers and the git helper the screenshot proof imports.
# Must precede the tests/ -> none rule.
[[e2e.rule]]
tier = "full"
path = "tests/conftest.py"
[[e2e.rule]]
tier = "full"
path = "tests/host/_synthetic_host.py"
[[e2e.rule]]
tier = "full"
path = "tests/_git_repo.py"

# The no-window flag: the suite's boot, port probe and tray helpers import it,
# so a break there stops the suite starting. Must precede the src/ -> none rule.
[[e2e.rule]]
tier = "full"
path = "src/no_window.py"

# The launcher tray.bat starts the shared helper through: the tray lifecycle e2e
# drives it, so it must not route "none" just because it lives under src/.
[[e2e.rule]]
tier = "full"
path = "src/ps_script.py"

# The usage-log router is the server the usage-log e2e drives (#349), so it is
# a browser surface despite living under src/. Must precede the src/ rule.
[[e2e.rule]]
tier = "full"
path = "src/usage_log.py"

# The screenshot-baseline comparison is proven by a browser test, so it is a
# browser surface despite living under scripts/. Must precede the scripts/ rule.
[[e2e.rule]]
tier = "full"
path = "scripts/shot_baseline.py"

# The WebKit rerun of the request-budget test drives a browser too.
[[e2e.rule]]
tier = "full"
path = "scripts/tools/webkit_budget_check.py"

# Backend/tooling with no browser impact -> no browser suite needed.
[[e2e.rule]]
tier       = "none"
prefix     = "src/"
extensions = ["py"]
[[e2e.rule]]
tier       = "none"
prefix     = "tests/"
extensions = ["py"]
# Synthetic adopter repos the generator tests parse (#412); a dotfile like
# .fleet.toml has no extension to match, so the whole folder is declared inert.
[[e2e.rule]]
tier   = "none"
prefix = "tests/fixtures/"
[[e2e.rule]]
tier   = "none"
prefix = "scripts/"
[[e2e.rule]]
tier   = "none"
prefix = "config/"
[[e2e.rule]]
tier   = "none"
prefix = "docs/"
[[e2e.rule]]
tier   = "none"
prefix = ".github/"
[[e2e.rule]]
tier       = "none"
extensions = ["md"]
[[e2e.rule]]
tier = "none"
path = ".fleet.toml"
[[e2e.rule]]
tier = "none"
path = ".gitignore"
# The ratchet baselines are data for scripts/*_ratchet.py, not a browser surface;
# unlisted they would fail safe to the full suite.
[[e2e.rule]]
tier   = "none"
prefix = ".ratchets/"
[[e2e.rule]]
tier = "none"
path = "LICENSE"
[[e2e.rule]]
tier = "none"
path = "AGENTS.md"
[[e2e.rule]]
tier = "none"
path = "CLAUDE.md"
[[e2e.rule]]
tier       = "none"
extensions = ["bat"]

# Surfaces (#258): a diff that would route "full" but whose every full- or
# static-tier path sits in ONE surface below runs only that surface's
# pytest_targets. Anything shared stays OUT of every surface on purpose --
# conftest.py, _color_assertions.py, _nav_graft.py (the nav, row-menu and
# base harnesses' shared mount), demo.html (both vendored harnesses drive
# the gallery), icons/ (the nav harness renders the sprite), the Streamlit app
# -- so a change there keeps the whole suite. A path in two surfaces, or a diff
# spanning two, also keeps the whole suite. tests/test_classify_e2e.py pins
# these, including that every importer of a surface's helper is in its targets.
[[e2e.surface]]
name           = "nav"
prefixes       = ["app/webapp/static/_vendored/nav/"]
# The base harness also mounts the real nav, and the row-menu harness lays out
# the real pill the menu fits against, so a nav edit runs both. The shot
# capture holds the pill-at-rest screenshots, so a nav edit recaptures them
# and the screenshot baseline compares them.
paths          = [
    "tests/e2e/_nav_slide_checks.py",
    "tests/e2e/_nav_state_checks.py",
    "tests/e2e/test_nav_offset.py",
    "tests/e2e/test_vendored_nav.py",
]
pytest_targets = [
    "tests/e2e/test_nav_offset.py",
    "tests/e2e/test_shot_capture.py",
    "tests/e2e/test_vendored_base.py",
    "tests/e2e/test_vendored_nav.py",
    "tests/e2e/test_vendored_row_menu.py",
]

# The gallery components. test_vendored_nav.py mounts on the same gallery
# page, so a component stylesheet can reach it -- both harnesses run. The
# row-menu harness's placement case loads row-menu.js by URL, so every
# component edit runs it too.
[[e2e.surface]]
name     = "components"
prefixes = [
    "app/webapp/static/_vendored/action-row/",
    "app/webapp/static/_vendored/base/",
    "app/webapp/static/_vendored/button/",
    "app/webapp/static/_vendored/card/",
    "app/webapp/static/_vendored/chip/",
    "app/webapp/static/_vendored/code-listing/",
    "app/webapp/static/_vendored/color-scheme/",
    "app/webapp/static/_vendored/day-marks/",
    "app/webapp/static/_vendored/day-row/",
    "app/webapp/static/_vendored/disclosure/",
    "app/webapp/static/_vendored/empty-state/",
    "app/webapp/static/_vendored/fullscreen/",
    "app/webapp/static/_vendored/home-head/",
    "app/webapp/static/_vendored/icon-button/",
    "app/webapp/static/_vendored/icon-tile/",
    "app/webapp/static/_vendored/mic-notice/",
    "app/webapp/static/_vendored/modal/",
    "app/webapp/static/_vendored/page-foot/",
    "app/webapp/static/_vendored/range-tab/",
    "app/webapp/static/_vendored/rec-wave/",
    "app/webapp/static/_vendored/row-menu/",
    "app/webapp/static/_vendored/segmented/",
    "app/webapp/static/_vendored/select-native/",
    "app/webapp/static/_vendored/settings-group/",
    "app/webapp/static/_vendored/switch/",
    "app/webapp/static/_vendored/text-size/",
    "app/webapp/static/_vendored/toast/",
]
paths          = [
    "tests/e2e/_action_row_avatar_checks.py",
    "tests/e2e/_chip_checks.py",
    "tests/e2e/_code_listing_checks.py",
    "tests/e2e/_day_checks.py",
    "tests/e2e/components/_fullscreen_checks.py",
    "tests/e2e/components/test_page_foot.py",
    "tests/e2e/_mic_notice_checks.py",
    "tests/e2e/_settings_group_checks.py",
    "tests/e2e/test_vendored_base.py",
    "tests/e2e/test_vendored_components.py",
    "tests/e2e/test_vendored_home_head.py",
    "tests/e2e/test_vendored_rec_wave.py",
    "tests/e2e/test_vendored_row_menu.py",
]
pytest_targets = [
    "tests/e2e/components/test_page_foot.py",
    "tests/e2e/test_vendored_base.py",
    "tests/e2e/test_vendored_components.py",
    "tests/e2e/test_vendored_home_head.py",
    "tests/e2e/test_vendored_nav.py",
    "tests/e2e/test_vendored_rec_wave.py",
    "tests/e2e/test_vendored_row_menu.py",
]

# The rendered-geometry helper and its hermetic fixtures. The component
# harness imports the helper for range-tab's touch targets (#267), and the
# nav harness for the pill's tap rectangles (#348), so an edit to
# _geometry.py runs both.
[[e2e.surface]]
name           = "geometry"
prefixes       = ["tests/e2e/fixtures/geometry/"]
paths          = ["tests/e2e/_geometry.py", "tests/e2e/test_geometry_helper.py"]
pytest_targets = [
    "tests/e2e/test_geometry_helper.py",
    "tests/e2e/components/test_page_foot.py",
    "tests/e2e/test_harness_helpers.py",
    "tests/e2e/test_vendored_components.py",
    "tests/e2e/test_vendored_home_head.py",
    "tests/e2e/test_vendored_nav.py",
    "tests/e2e/test_vendored_row_menu.py",
]

# The layout lint and its broken/fixed fixture page. It imports _geometry.py
# (listed above) and _shot.py (whole suite), so those edits reach it too.
[[e2e.surface]]
name           = "layout-lint"
prefixes       = ["tests/e2e/fixtures/layout/"]
paths          = [
    "tests/e2e/_cwd_isolation_checks.py",
    "tests/e2e/_layout_lint.py",
    "tests/e2e/_surface_hook_checks.py",
    "tests/e2e/test_harness_helpers.py",
]
pytest_targets = ["tests/e2e/test_harness_helpers.py"]

# The usage log (#349): client module + server router, driven end to end by
# its own harness. The gallery loads the client in a separate module script,
# so a usage-log edit cannot stop the gallery's own script and needs no other
# harness; demo.html itself stays shared (whole suite).
[[e2e.surface]]
name           = "usage-log"
prefixes       = ["app/webapp/static/_vendored/usage-log/"]
paths          = ["src/usage_log.py", "tests/e2e/test_vendored_usage_log.py"]
pytest_targets = ["tests/e2e/test_vendored_usage_log.py"]

# The sign-in sheet, driven by its own harness over the gallery page, which does
# not load it; demo.html stays shared (whole suite).
[[e2e.surface]]
name           = "sign-in"
prefixes       = ["app/webapp/static/_vendored/sign-in/"]
paths          = ["tests/e2e/test_vendored_sign_in.py"]
pytest_targets = ["tests/e2e/test_vendored_sign_in.py"]

# The screenshot baseline: the comparison, its proof and the committed PNGs.
# The capture helper tests/e2e/_shot.py stays out: conftest imports it, so an
# edit there runs the whole suite.
# The poll helper and the request-budget probe that proves it; the probe page is a
# route of the test itself, so no other harness reads either. The WebKit stage that
# reruns the same test (scripts/tools/webkit_budget_check.py) belongs here too.
[[e2e.surface]]
name           = "poll"
prefixes       = ["app/webapp/static/_vendored/poll/"]
paths          = ["tests/e2e/budget/_request_budget.py", "tests/e2e/budget/test_vendored_poll.py", "scripts/tools/webkit_budget_check.py"]
pytest_targets = ["tests/e2e/budget/test_vendored_poll.py"]

[[e2e.surface]]
name           = "shot-baseline"
prefixes       = ["tests/e2e/shots/"]
paths          = ["scripts/shot_baseline.py", "tests/e2e/test_shot_capture.py"]
pytest_targets = ["tests/e2e/test_shot_capture.py"]

# ---------------------------------------------------------------------------
# Static-analysis ratchet (project-scaffolding#410). scripts/verify-before-ship.ps1
# runs scripts/static_ratchet.py, which fails only on a duplicated block (jscpd,
# Python + JS), an unused import/variable (ruff F401/F841) or a curated ruff
# bug/security pattern (B/S, `ruff_rules`) that is NEW relative to the committed
# baseline. Opt-in per repo through this table: absent or
# `enabled = false` is the declared "not enabled" skip, so re-vendoring the
# script never breaks an adopter. Procedure + limits: docs/static-ratchet.md.
# This scaffold owns the vendored copies, so it does not exclude `_vendored/`
# (an adopter does: its copies are duplicates by design).
# The ratchet scripts are the exception: each is stdlib-only and vendored on its
# own, so they cannot import a shared module and repeat their config, glob and
# git-listing helpers by contract. An adopter's `[vendored]` table excludes the
# same files; the general ruff stage still lints them.
[static_ratchet]
enabled = true
exclude = ["scripts/*_ratchet.py"]

# ---------------------------------------------------------------------------
# Comment ratchet (project-scaffolding#411). scripts/verify-before-ship.ps1 runs
# scripts/comment_ratchet.py, which fails when a file's count of `#NNN` issue
# references inside comments (Python, JS, CSS, PowerShell) rises above the
# committed baseline. Opt-in per repo through this table, like [static_ratchet].
# The rule text is fleet-config#1517; procedure + limits: docs/comment-ratchet.md.
# This scaffold owns the vendored copies, so it does not exclude `_vendored/`
# (an adopter's `[vendored]` table excludes its copies automatically).
# Two further rules are opt-in per adopter, each under its own baseline key:
# `docstrings = true` (`#NNN` inside Python docstrings) and `history_phrases =
# true` (a short curated list of decision-history phrases and patterns in
# comments and docstrings). Both are on here. An adopter may add its own
# regexes with `extra_history_patterns`; the scaffold needs none.
[comment_ratchet]
enabled = true
docstrings = true
history_phrases = true

# ---------------------------------------------------------------------------
# Docs ratchet. scripts/verify-before-ship.ps1 runs scripts/docs_ratchet.py,
# which fails when the root README grows past its byte budget (40 KiB unless
# `readme_max_bytes` says otherwise) or when a file's count of history markers
# (issue references, dated headings, changelog headings) in README.md and
# docs/**/*.md rises above the committed baseline. Opt-in per repo through this
# table, like [comment_ratchet]. Convention: docs/readme-and-docs.md;
# mechanism + limits: docs/docs-ratchet.md.
# docs/agents/CLAUDE.master.md is the byte mirror of CLAUDE.md (an instruction
# file, outside this ratchet's scope), so its decision-record references are
# excluded with it; tests/test_claude_master_sync.py keeps the two identical.
# `allow_refs` keeps the one canonical-issue link brand-icons.md opens with.
[docs_ratchet]
enabled    = true
exclude    = ["docs/agents/CLAUDE.master.md"]
allow_refs = ["app-launcher#65"]

# ---------------------------------------------------------------------------
# Structure ratchet. scripts/verify-before-ship.ps1 runs
# scripts/structure_ratchet.py, which fails when a file passes 1,000 lines, a
# Python or JS function passes 100 lines, a directory passes 40 modules, or a
# src/ module imports app/, beyond the committed baseline. Opt-in per repo
# through this table, like [docs_ratchet]; the defaults are the limits in
# docs/repo-layout.md; `near_limit_ratio` (default 0.9) sets the shrink-only
# near-limit band. Mechanism + limits: docs/structure-ratchet.md.
[structure_ratchet]
enabled = true

# ---------------------------------------------------------------------------
# Instruction ratchet. scripts/verify-before-ship.ps1 runs
# scripts/instruction_ratchet.py, which fails when an instruction file
# (CLAUDE.md, AGENTS.md, .claude/rules/*.md, a SKILL.md or a doc a skill
# references) gains a hit of one of the prompt audit's deterministic lint rules,
# or passes its size cap, beyond the committed baseline. Opt-in per repo through
# this table, like [structure_ratchet]; `skill_dirs` and `extra_files` widen the
# scope. Mechanism + limits: docs/instruction-ratchet.md.
[instruction_ratchet]
enabled = true
# File-shape rules, each off until listed (docs/instruction-ratchet.md). This scaffold is not an app repo,
# so it sets no claude_md_max_lines.
ci_expectations = true
agents_pointer = true
# Repeated text (S-04): a run of 12 shared words with docs/ is a hit. No `repeated_text_global`: the
# global file exists only on the owner's machine, and this gate also runs in a fresh clone.
repeated_text_words = 12
# The master template is CLAUDE.md's body by design (tests/test_claude_master_sync.py), so it is never a source.
repeated_text_exclude = ["docs/agents/CLAUDE.master.md"]

# ---------------------------------------------------------------------------
# Doc references ratchet. scripts/verify-before-ship.ps1 runs
# scripts/doc_refs_ratchet.py, which fails when README.md, CLAUDE.md or
# docs/**/*.md names a repo path, `python -m` module or loopback port that does
# not exist (a port is checked against `port` above, when declared), beyond the
# committed baseline. Opt-in per repo through this table, like
# [instruction_ratchet]. `allow_refs` lists intentional pointers: here, the files
# an adopter creates from the scaffold's templates and instructions, and the
# folders a shape's contract names in docs/repo-layout.md that this tree lacks.
# `trees` also checks the fenced layout trees (off by default for adopters).
# Mechanism + limits: docs/doc-refs-ratchet.md.
[doc_refs_ratchet]
enabled    = true
trees      = true
allow_refs = [
    "docs/layout.md",
    "tests/fixtures",
    "tests/weekly",
    "app/cli",
    "app/webapp/routers",
    ".github/workflows/ci.yml",
    ".github/workflows/main-gate-watch.yml",
    "scripts/gen_icons.py",
    "scripts/gen_ssl_cert.py",
    "docs/ux-surfaces.yaml",
    "docs/install.md",
]

# ---------------------------------------------------------------------------
# Dead code ratchet. scripts/verify-before-ship.ps1 runs
# scripts/dead_code_ratchet.py, which fails when a tracked Python file gains a
# function, class or method nothing references (route handlers, `__all__`,
# tests, hooks and the published API of [components] below are entry points),
# beyond the committed baseline. Opt-in per repo through this table, like
# [doc_refs_ratchet]. `allow` names the two functions adopters call from their
# own tree: the scaffold never calls them itself.
# Mechanism + limits: docs/dead-code-ratchet.md.
[dead_code_ratchet]
enabled = true
allow   = [
    "app/log_panel.py:render_log_panel",
    "scripts/tools/brand_gen.py:render_set",
]

# ---------------------------------------------------------------------------
# Conventions ratchet. scripts/verify-before-ship.ps1 runs
# scripts/conventions_ratchet.py, which fails when a tracked file gains a
# hit of one of the listed fleet-convention rules (a spawn without the no-window
# flag, a print in app code, a hardcoded drive path, a raw secret compare outside
# `secret_helpers`, a raw git spawn outside `git_wrappers`; in a web file, a
# password input outside the vendored sign-in sheet; a `must_use` call outside
# the one file the repo names for it; an implicit-state-machine suspect outside a
# module the top-level [[state_machines]] table declares), beyond the committed baseline. Opt-in per
# repo and per rule through this table, like [dead_code_ratchet]. The scaffold has
# no secret-compare helper or git wrapper, so it enforces the four rules that need
# none, plus two must_use entries.
# Mechanism + limits: docs/conventions-ratchet.md.
[conventions_ratchet]
enabled = true
rules   = ["no-window", "logging-not-print", "no-drive-path", "password-input-vendored", "nav-standalone-head", "login-lockout",
           "subprocess-timeout", "browser-per-iteration", "path-sep", "host-identity", "state-literal", "state-set-repeat", "state-write"]

# Outbound HTTP goes through the pooled session, not a bare requests call.
[[conventions_ratchet.must_use]]
call   = ["requests.get", "requests.post", "requests.put", "requests.patch", "requests.delete", "requests.head", "requests.request"]
helper = ["src/pooled_http.py"]
why    = "CLAUDE.md: outbound-connection discipline, one pooled session"
paths  = ["app/", "src/"]

# A SQLite connection is opened in one module, not per handler. The scaffold has no FastAPI app, so its
# one store (the vendored usage log) is the home; a derived app names the module that defines `get_db`.
[[conventions_ratchet.must_use]]
call   = "sqlite3.connect"
helper = ["src/usage_log.py"]
why    = "CLAUDE.md: one get_db dependency owns the connection"
paths  = ["app/", "src/"]

# Declared implicit-state machines: the one module that owns each, so the state rules
# stop reporting it. Mechanism: docs/conventions-ratchet.md; convention: docs/implicit-state-machines.md.
[[state_machines]]
name   = "tray-watchdog"
module = "app/tray/watchdog.py"
type   = "WatchState"
derive = "next_watch_state"

[[state_machines]]
name   = "self-restart run"
module = "src/self_restart.py"
type   = "RestartState"
derive = "derive_restart_state"

# ---------------------------------------------------------------------------
# Runtime write ratchet. scripts/verify-before-ship.ps1 runs
# scripts/runtime_write_ratchet.py, which fails when a tracked Python file gains a
# write target (open for writing, Path.write_*, mkdir, a log FileHandler,
# sqlite3.connect, a copy destination) whose path resolves under a code folder,
# beyond the committed baseline; a new target it cannot resolve is "not
# confirmed" (exit 3), never clean. The same script brackets the test stages
# (--snapshot before, --probe after) and fails on any untracked or ignored file
# the run left under a code folder. Opt-in per repo through this table, like
# [conventions_ratchet]; the defaults cover src, app, scripts, hooks, skills.
# Mechanism + limits: docs/runtime-write-ratchet.md.
[runtime_write_ratchet]
enabled = true

# ---------------------------------------------------------------------------
# Usage track ratchet. scripts/verify-before-ship.ps1 runs
# scripts/usage_track_ratchet.py, which fails when a web app's HTML or JS gains a
# control with no constant `data-track` id, a <dialog> with no `data-track-view`,
# or a tracking id built at run time, beyond the committed baseline; with
# `usage-log-wired` listed it also fails, never baselined, when the app does not
# vendor, start and mount its usage log. Opt-in per repo and per rule through this
# table, like [conventions_ratchet]. The scaffold is not a web app, so it holds
# its component tree to the three markup rules and does not claim the wiring.
# Mechanism + limits: docs/usage-track-ratchet.md.
[usage_track_ratchet]
enabled = true
rules   = ["untracked-control", "untracked-sheet", "dynamic-id"]
# Excluded: the component preview pages (demo.html and each component's own
# <name>.html fragment) are specimens a reader opens, not app UI, and adopters vendor
# the component's css/js, never its preview. The three .js builders are vendored but
# build a control whose id belongs to the caller (the adopter's call site stamps
# `data-track`), so the constant cannot live in this file.
exclude = [
  "app/webapp/static/_vendored/action-row/action-row.html",
  "app/webapp/static/_vendored/button/button.html",
  "app/webapp/static/_vendored/chip/chip.html",
  "app/webapp/static/_vendored/code-listing/code-listing.html",
  "app/webapp/static/_vendored/day-marks/day-marks.html",
  "app/webapp/static/_vendored/day-row/day-row.html",
  "app/webapp/static/_vendored/demo.html",
  "app/webapp/static/_vendored/disclosure/disclosure.html",
  "app/webapp/static/_vendored/empty-state/empty-state.js",
  "app/webapp/static/_vendored/fullscreen/fullscreen.html",
  "app/webapp/static/_vendored/home-head/home-head.html",
  "app/webapp/static/_vendored/icon-button/icon-button.html",
  "app/webapp/static/_vendored/modal/modal.html",
  "app/webapp/static/_vendored/range-tab/range-tab.html",
  "app/webapp/static/_vendored/row-menu/row-menu.html",
  "app/webapp/static/_vendored/row-menu/row-menu.js",
  "app/webapp/static/_vendored/segmented/segmented.html",
  "app/webapp/static/_vendored/select-native/select-native.html",
  "app/webapp/static/_vendored/switch/switch.html",
  "app/webapp/static/_vendored/switch/switch.js",
  "app/webapp/static/_vendored/text-size/text-size.html",
]

# ---------------------------------------------------------------------------
# UX surface ratchet. scripts/verify-before-ship.ps1 runs
# scripts/ux_surface_ratchet.py, which fails when a web app's HTML or JS gains a
# surface root (a <dialog>, a dialog/menu/tabpanel role, a popover) with no
# `data-surface` id, an id with no entry in its docs/ux-surfaces.yaml, a map
# entry no element carries, a duplicated or non-constant id, a link to no entry,
# or a docs/ux-surface-map.md page not regenerated from the map, beyond the
# committed baseline. Opt-in per repo through this table, like
# [usage_track_ratchet]. Off here: the scaffold serves no web app, so it has no
# surface map; its docs/ux-surface-map.md is the convention, not a generated page.
# Mechanism + limits: docs/ux-surface-ratchet.md.
[ux_surface_ratchet]
enabled = false

# ---------------------------------------------------------------------------
# Request budget ratchet. scripts/verify-before-ship.ps1 runs
# scripts/request_budget_ratchet.py, which fails when a fixed-rate browser poll
# that reaches the server, a poll under the 2 s floor, an undeclared fast server
# loop, a directory walk in a request handler, a submit to the shared default
# pool, or a web app without the request-timing middleware is new beyond the
# committed baseline. Opt-in per repo through this table, like
# [usage_track_ratchet]; every rule is on unless `rules` narrows it.
# `[[request_budget.loops]]` declares a background loop that must run while
# nobody is viewing; `[request_budget] visible_requests_per_minute` is the
# browser probe's budget (tests/e2e/budget/_request_budget.py). The scaffold has no
# request handlers, so it declares no handler_dirs (scan-per-request prints OFF),
# and its baseline is empty: the build-watch poll runs through the vendored poll
# helper, four loops whose interval is a caller's argument are declared below with
# their reason, and the usage-log adapter's sub-app is excluded because the host
# app's own middleware times it. Mechanism + limits:
# docs/request-budget-ratchet.md; the rules and why: docs/polling-budget.md.
[request_budget_ratchet]
enabled = true
# The adapter builds the FastAPI sub-app its one Starlette route serves. The host
# app's RequestTimingMiddleware already times every request through that route, so
# a second one on the sub-app would stack two Server-Timing headers and count each
# request twice in the in-flight stats. The file has no loop, poll or pool.
exclude = ["src/usage_log_starlette.py"]

# The browser tests scripts/tools/webkit_budget_check.py runs on WebKit. Declared because
# discovery (every test file that calls the probe) would also pick up that script's
# own unit test, which names the probe call in a string.
[webkit_budget]
targets = ["tests/e2e/budget/test_vendored_poll.py"]

[[request_budget.loops]]
path       = "app/log_panel.py"
function   = "stream_to_streamlit"
interval_s = 0.25
why        = "repaints the live log panel only while the caller's own work() runs and ends the moment it finishes; the person who started that run is the viewer"

[[request_budget.loops]]
path       = "app/tray/watchdog.py"
function   = "retry_with_backoff"
interval_s = 5
why        = "bounded startup retry: sleeps the caller's delays (5, 15, 30 s by default) between attempts, then raises; it runs once at tray start, before any page exists"

[[request_budget.loops]]
path       = "app/tray/watchdog.py"
function   = "HealthWatchdog.run"
interval_s = 60
why        = "the tray's health probe exists to notice a dead or wedged webapp while nobody is looking; a viewer-gated probe would never fire"

[[request_budget.loops]]
path       = "src/resource_probe.py"
function   = "start_breadcrumb.run"
interval_s = 300
why        = "logs the process's thread, handle and memory counts every 5 minutes (the caller's interval) so a leak is diagnosable from the log after the fact; no viewer reads a log line live"

# ---------------------------------------------------------------------------
# Windows-only ratchet. scripts/verify-before-ship.ps1 runs
# scripts/windows_only_ratchet.py, which fails when a test module gains a test
# that touches a Windows-only API (a win32/winreg import, ctypes.windll,
# os.startfile, the Windows subprocess flags, a Windows-only environment read, or
# a .exe planted under a fake ProgramFiles) without the windows_only marker the
# Mac nightly's unit leg filters on, beyond the committed baseline. Adopt it
# alongside [ci.nightly]; opt-in per repo through this table. On here although
# the scaffold's own [ci.nightly] is not declared: the scaffold dogfoods every
# ratchet it publishes. Mechanism + limits: docs/windows-only-ratchet.md.
[windows_only_ratchet]
enabled = true

# ---------------------------------------------------------------------------
# Port host ratchet. scripts/verify-before-ship.ps1 runs
# scripts/port_host_ratchet.py, which fails when a script or code file gains a
# port literal (`127.0.0.1:8445`, `PORT=8501`, `--port 8130`) or a machine-local
# host (a LAN or tailnet address, a *.ts.net name) outside the files listed in
# `resolvers` and the samples, beyond the committed baseline: a clean pull plus
# restart is the whole update, so machine-local values live in ignored config.
# Opt-in per repo through this table. The scaffold has no config resolver, so it
# lists none and baselines its launcher and probe defaults.
# Mechanism + limits: docs/port-host-ratchet.md.
[port_host_ratchet]
enabled = true

# ---------------------------------------------------------------------------
# Install standard ratchet. scripts/verify-before-ship.ps1 runs
# scripts/install_standard_ratchet.py, which fails when the repo lacks a piece
# of the install standard beyond the committed baseline: the three installer
# modules vendored at the scaffold's current content, [install.migrate] that
# parses, and a playbook with Install, Update and Migrate sections. Opt-in per
# repo through this table. The scaffold is not an installable app: it holds its
# playbook template to the rule and baselines its missing [install.migrate].
# Mechanism + limits: docs/install-standard-ratchet.md.
[install_standard_ratchet]
enabled  = true
playbook = "docs/templates/install-playbook.md"

# ---------------------------------------------------------------------------
# Clean tree ratchet. scripts/verify-before-ship.ps1 runs
# scripts/clean_tree_ratchet.py, which records `git status --porcelain`, runs
# the start smoke below once, and fails when it added, modified or deleted a
# path beyond the committed baseline: starting a repo leaves `git status`
# unchanged. A Streamlit server answers its health route before any page runs,
# so the smoke runs the app's page headlessly through AppTest instead, with the
# app folder on sys.path as `streamlit run` puts it; a page exception exits 1.
# Opt-in per repo through this table. Mechanism + limits: docs/clean-tree-ratchet.md.
[clean_tree_ratchet]
enabled   = true
smoke     = ["{python}", "-c", """import sys; sys.path.insert(0, 'app'); from streamlit.testing.v1 import AppTest; at = AppTest.from_file('app/app.py', default_timeout=30).run(); sys.exit(1 if at.exception else 0)"""]
timeout_s = 90

# ---------------------------------------------------------------------------
# Test value ratchet and weekly burst. scripts/test_value_ratchet.py checks a
# gate run recorded by scripts/unit_ledger.py: a new test unit shows its value
# (red before the fix, a covered line no other unit covers, or an exempt
# marker), no unit's process spawns rise, open flakes only shrink, and (weekly)
# a unit green here is green in a fresh clone. scripts/weekly_burst.py runs the
# burn and load units, the fresh-clone gate, the coverage map and the medians
# once a week. Unlike the stages above it reads the run's results, so it runs
# after the tests, never as a pre-test stage. Off here: the scaffold's gate does
# not record a unit ledger. Keys, steps and the gate wiring:
# docs/test-value-ratchet.md.
[test_value_ratchet]
enabled = false

[test_value_burst]
enabled = false

# ---------------------------------------------------------------------------
# Screenshot baseline. scripts/verify-before-ship.ps1 runs
# scripts/shot_baseline.py after the e2e stage: it compares the screenshots the
# run recaptured (tests/e2e/_shot.py: phone + desktop, light + dark) with the
# committed PNGs under `shots_dir`, fails on any visible change, then restores
# the tree. Opt-in per repo through this table, like [structure_ratchet];
# `capture` is the argv after the interpreter that the --baseline and two-run
# modes run. Contract + re-baseline steps: docs/playwright-ui-testing.md
# ("Screenshot baseline").
[shot_baseline]
enabled   = true
shots_dir = "tests/e2e/shots"
capture   = ["-m", "pytest", "tests/e2e/test_shot_capture.py::test_gallery_shots", "-q", "-p", "no:cacheprovider"]

# ---------------------------------------------------------------------------
# [components] -- the canonical catalog of this scaffold's vendor-verbatim
# components. ONLY project-scaffolding carries this table; an adopter
# repo records what it copied in its own `[vendored]` table instead.
#
# Why it exists: `/propagate-vendored <component>` builds its adopter list from
# the adopters' `[vendored]` entries, so a repo that carries a component on disk
# but never declared it is invisible to the wave -- the fan-out re-vendors the
# repos that declared it, reports success, and leaves the undeclared carriers on
# the stale bytes with nobody told. This table is the missing half: the key ->
# source-path map that lets `vendored_drift.py` hash every fleet repo's copy of
# a KNOWN component path and name the repos carrying one they don't declare.
#
# Contract:
#   * `src` is the path in THIS repo. An adopter's default destination is the
#     same relative path (an adopter that puts it elsewhere declares `dest` in
#     its own `[vendored]` entry, and is found by that entry rather than here).
#   * The key is the manifest key adopters use -- changing one orphans every
#     adopter's entry, so treat these as stable identifiers.
#   * Add a component here in the SAME PR that adds it to the tree.
#     `tests/test_vendored_catalog.py` fails otherwise, and
#     `scripts/verify-before-ship.ps1` derives its `mypy --strict` gate list
#     from this table -- one catalog, not three hand-maintained lists.
#   * Copy-to-adapt templates (`tray.bat.template`,
#     `.github/workflows/main-gate-watch.yml.template`, `scripts/gen_tailscale_cert.py`)
#     are deliberately ABSENT: they are edited on arrival, so byte-identity
#     never holds and an "undeclared carrier" finding over them would be pure
#     noise.
[components]
# Web-app UI components (app/webapp/static/_vendored/) -- see that dir's README.
base            = { src = "app/webapp/static/_vendored/base" }
# The color-scheme trio alone, for an app without base (base.css repeats it).
color-scheme    = { src = "app/webapp/static/_vendored/color-scheme" }
nav             = { src = "app/webapp/static/_vendored/nav" }
icons           = { src = "app/webapp/static/_vendored/icons" }
card            = { src = "app/webapp/static/_vendored/card" }
button          = { src = "app/webapp/static/_vendored/button" }
modal           = { src = "app/webapp/static/_vendored/modal" }
disclosure      = { src = "app/webapp/static/_vendored/disclosure" }
empty-state     = { src = "app/webapp/static/_vendored/empty-state" }
select-native   = { src = "app/webapp/static/_vendored/select-native" }
switch          = { src = "app/webapp/static/_vendored/switch" }
# The full Settings page: page shell, inset groups, sentence-case labels, four row variants, sheet fit.
settings-group  = { src = "app/webapp/static/_vendored/settings-group" }
icon-tile       = { src = "app/webapp/static/_vendored/icon-tile" }
range-tab       = { src = "app/webapp/static/_vendored/range-tab" }
segmented       = { src = "app/webapp/static/_vendored/segmented" }
# The toggle pill that joins or leaves a filter or a day set (aria-pressed, optional count).
chip            = { src = "app/webapp/static/_vendored/chip" }
home-head       = { src = "app/webapp/static/_vendored/home-head" }
page-foot       = { src = "app/webapp/static/_vendored/page-foot" }
action-row      = { src = "app/webapp/static/_vendored/action-row" }
text-size       = { src = "app/webapp/static/_vendored/text-size" }
# The Edge-only "Full screen" Settings row: a switch that hides the browser chrome, kept per device.
fullscreen      = { src = "app/webapp/static/_vendored/fullscreen" }
toast           = { src = "app/webapp/static/_vendored/toast" }
# The "New version available · Reload" prompt, on the toast's glass; polls through `poll`.
build-watch     = { src = "app/webapp/static/_vendored/build-watch" }
rec-wave        = { src = "app/webapp/static/_vendored/rec-wave" }
# The recorder's input name and silent-mic warning, built on rec-wave.
mic-notice      = { src = "app/webapp/static/_vendored/mic-notice" }
row-menu        = { src = "app/webapp/static/_vendored/row-menu" }
icon-button     = { src = "app/webapp/static/_vendored/icon-button" }
# A fenced block or a diff in its frame; its copy control is an unpainted icon-button.
code-listing    = { src = "app/webapp/static/_vendored/code-listing" }
# The date-keyed row (an action-row led by a date tile) and the day marks (#350).
day-row         = { src = "app/webapp/static/_vendored/day-row" }
day-marks       = { src = "app/webapp/static/_vendored/day-marks" }
# The usage log's client half; its server half is `usage_log` below (#349).
usage-log       = { src = "app/webapp/static/_vendored/usage-log" }
# The one password sign-in sheet; conventions_ratchet's password-input-vendored rule holds apps to it.
sign-in         = { src = "app/webapp/static/_vendored/sign-in" }
# Self-scheduling, single-flight polls that pause on a hidden tab; the request budget ratchet holds apps to it.
poll            = { src = "app/webapp/static/_vendored/poll" }

# Web-page (static site) components (app/site/static/_vendored/) -- see that dir's README.
site-tokens      = { src = "app/site/static/_vendored/site-tokens" }
site-base        = { src = "app/site/static/_vendored/site-base" }
site-header      = { src = "app/site/static/_vendored/site-header" }
site-section     = { src = "app/site/static/_vendored/site-section" }
site-image       = { src = "app/site/static/_vendored/site-image" }
site-video       = { src = "app/site/static/_vendored/site-video" }
site-button      = { src = "app/site/static/_vendored/site-button" }
site-card        = { src = "app/site/static/_vendored/site-card" }
site-testimonial = { src = "app/site/static/_vendored/site-testimonial" }
site-carousel    = { src = "app/site/static/_vendored/site-carousel" }
site-product     = { src = "app/site/static/_vendored/site-product" }
site-pen         = { src = "app/site/static/_vendored/site-pen" }
site-footer      = { src = "app/site/static/_vendored/site-footer" }
site-consent     = { src = "app/site/static/_vendored/site-consent" }
site-theme       = { src = "app/site/static/_vendored/site-theme" }

# The one launch line of a web app: hypercorn over HTTP/2 with the uvicorn fallback, selector loop pinned.
webapp_serve    = { src = "app/webapp/serve.py" }

# Windows tray primitives -- docs/windows-tray.md (gotchas #4, #5).
single_instance = { src = "app/tray/single_instance.py" }
tray_watchdog   = { src = "app/tray/watchdog.py" }

# e2e harness primitives -- docs/playwright-ui-testing.md.
geometry        = { src = "tests/e2e/_geometry.py" }
e2e_live_guard  = { src = "tests/e2e/_e2e_live_guard.py" }
browser_sweep   = { src = "tests/e2e/_browser_sweep.py" }
# Answers the harness server's static GETs in-context and names ERR_ADDRESS_IN_USE; conftest imports its hooks.
e2e_loopback    = { src = "tests/e2e/_loopback.py" }
# One reused context + page for any capture or design walk, paced by the target port's TIME_WAIT count.
paced_browser   = { src = "tests/e2e/_paced_browser.py" }
# The design-surface capture hook; conftest imports its collection hook (#408).
surface_capture = { src = "tests/e2e/_surface.py" }
# The screenshot baseline's capture half; its comparison is `shot_baseline` below. Its privacy check
# looks for the synthetic account name, so `requires` makes /propagate-vendored carry synthetic_host too.
shot_capture    = { src = "tests/e2e/_shot.py", requires = ["synthetic_host"] }
# The fake account name, home folder and interpreter path tests read instead of the real host's
# (conventions_ratchet's host-identity rule); the adopter's tests/conftest.py imports its fixture.
synthetic_host  = { src = "tests/host/_synthetic_host.py" }
layout_lint     = { src = "tests/e2e/_layout_lint.py" }
# A minute visible, a minute hidden on a fake clock, API requests counted by path (docs/polling-budget.md).
request_budget_probe = { src = "tests/e2e/budget/_request_budget.py" }
# The resource soak (needs `resource_probe`); not a browser helper, so it lives in its own tests/soak/ folder.
resource_soak   = { src = "tests/soak/_resource_soak.py" }

# Scripts + library modules copied byte-for-byte into adopters.
classify_e2e    = { src = "scripts/classify_e2e.py" }
# Runs the request-budget browser tests on WebKit as the Mac nightly does; not run (never a pass) without the browser.
webkit_budget_check = { src = "scripts/tools/webkit_budget_check.py" }
# Every ratchet loads this sibling to find its baseline in .ratchets/ and move an old root copy there once;
# each ratchet's `requires` names it, so /propagate-vendored carries it.
ratchet_baseline = { src = "scripts/ratchet_baseline.py" }
static_ratchet = { src = "scripts/static_ratchet.py", requires = ["ratchet_baseline"] }
comment_ratchet = { src = "scripts/comment_ratchet.py", requires = ["ratchet_baseline"] }
docs_ratchet    = { src = "scripts/docs_ratchet.py", requires = ["ratchet_baseline"] }
structure_ratchet = { src = "scripts/structure_ratchet.py", requires = ["structure_layout", "structure_band", "ratchet_baseline"] }
# structure_ratchet loads these siblings (shape presets, extra roots, placement; the near-limit band
# and its warning lines); `requires` makes /propagate-vendored carry all three.
structure_layout = { src = "scripts/structure_layout.py" }
structure_band  = { src = "scripts/structure_band.py" }
instruction_ratchet = { src = "scripts/instruction_ratchet.py", requires = ["instruction_frontmatter", "instruction_repeats", "ratchet_baseline"] }
# instruction_ratchet loads this sibling (the SKILL.md frontmatter reader); `requires` makes /propagate-vendored carry it.
instruction_frontmatter = { src = "scripts/instruction_frontmatter.py" }
# ...and, only when `repeated_text_words` is set (S-04), this one (the repeated-text finder).
instruction_repeats = { src = "scripts/instruction_repeats.py" }
doc_refs_ratchet = { src = "scripts/doc_refs_ratchet.py", requires = ["ratchet_baseline"] }
dead_code_ratchet = { src = "scripts/dead_code_ratchet.py", requires = ["ratchet_baseline"] }
conventions_ratchet = { src = "scripts/conventions_ratchet.py", requires = ["conventions_readers", "conventions_state", "ratchet_baseline"] }
# conventions_ratchet loads these siblings (the syntax-tree predicates and the web and text line rules; the
# implicit-state-machine readers); `requires` makes /propagate-vendored carry all three.
conventions_readers = { src = "scripts/conventions_readers.py" }
conventions_state = { src = "scripts/conventions_state.py" }
usage_track_ratchet = { src = "scripts/usage_track_ratchet.py", requires = ["usage_track_scan", "ratchet_baseline"] }
# usage_track_ratchet loads this sibling (the HTML and JS readers); `requires` makes /propagate-vendored carry both.
usage_track_scan = { src = "scripts/usage_track_scan.py" }
# ux_surface_ratchet reads JS through usage_track_scan's tokenizer and the YAML map through ux_surface_map (also
# the page generator adopters run); `requires` makes /propagate-vendored carry all three.
ux_surface_ratchet = { src = "scripts/ux_surface_ratchet.py", requires = ["usage_track_scan", "ux_surface_map", "ratchet_baseline"] }
