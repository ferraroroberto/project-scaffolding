# .fleet.toml — this repo's card on the fleet architecture map.
# fleet-config's /system-map aggregates every repo's .fleet.toml (schema +
# reasoning: fleet-config/architecture/README.md). Keep it current: update this
# in the same PR as any material change (layer, port, role, description,
# exposed services).
#
# `description` must fit two lines of its map card, so the cap is per layer:
# governance 130, enabling 80, working-web 95, working-pipe 70 characters,
# counted as written (`&amp;` is five). fleet-config's build_data.py refuses a
# longer one by repo name (fleet-config#1250; measurement: its
# architecture/README.md "Description cap"). Aim for one clause; extra detail
# goes in `chips`, `tag` or the README.
#
# CLONED A NEW REPO FROM THIS SCAFFOLD? Replace the values below with your repo's
# own — at minimum `description`, usually `icon`, and `layer` if it is not a
# pipeline (working-pipe). `layer` ∈ governance | enabling | working-web | working-pipe.
layer       = "governance"
icon        = "📐"
description = "Canonical master — the scaffold &amp; CLAUDE.md every project derives from."

# Which canonical tree the root layout is held to (docs/repo-layout.md). A root
# folder the shape does not list goes in `extra_roots = [...]`, with its reason in
# docs/layout.md. Read by scripts/structure_ratchet.py; ids and presets:
# docs/structure-ratchet.md. The scaffold is a streamlit repo with no extra roots.
shape       = "streamlit"
extra_roots = []

# Wide views (fleet-config#1113, design.md Layout): page width follows the shape of a
# view's content, per view. A one-dimensional view (settings, a form, one list, a
# detail) keeps the 772px measure; a two-dimensional one (board lanes, a many-field
# table, a tree with attribute columns, calendar days) may span the window. A web
# app declares those views here, by tab id; an undeclared view keeps the measure.
# fleet-config's design_lint + /design-review read the key. Uncomment and edit:
# [design]
# wide_views = ["board", "table"]

# Diff-proportionate e2e routing (project-scaffolding#180). scripts/verify-
# before-ship.ps1's browser phase classifies the branch's changed files
# against the rules below (first match wins, in this order) instead of
# always running the whole tests/e2e suite. Schema + rationale:
# docs/e2e-routing.md. Mechanism: scripts/classify_e2e.py. A path matching no
# rule below -- or a repo with no [e2e] table at all -- fails safe to the
# full suite; this table only ever narrows what an *already-covered* diff
# runs, never what an unmatched one runs.
[e2e]
static_pytest_target = "tests/e2e/test_smoke.py"
static_browsers       = ["chromium"]
full_pytest_target    = "tests/e2e"
# Suite-size ratchet in collected pytest nodes, read by fleet-config's /e2e
# budget step (not classify_e2e.py); adopters set their own count, or omit it
# for the scaffold's default of 15 (#260).
test_budget           = 48

# Inert image/font assets under the vendored static tree -> smoke is enough.
[[e2e.rule]]
tier       = "static"
prefix     = "app/webapp/static/"
extensions = ["svg", "png", "jpg", "jpeg", "gif", "ico", "webp", "avif", "woff", "woff2", "ttf", "eot", "otf", "webmanifest"]

# The component gallery is NOT an inert fragment: it carries a module script
# and is the page test_vendored_components.py and test_vendored_nav.py drive,
# and it fetches the icon sprite into that page -- so both run the whole suite
# (#258). Must precede the inert-HTML rule below.
[[e2e.rule]]
tier = "full"
path = "app/webapp/static/_vendored/demo.html"
[[e2e.rule]]
tier = "full"
path = "app/webapp/static/_vendored/icons/icons-sprite.html"
# The text-size boot snippet is a <script>, not markup: the component harness
# loads it byte-for-byte into a page's <head> (#276).
[[e2e.rule]]
tier = "full"
path = "app/webapp/static/_vendored/text-size/text-size-boot.html"

# A vendored HTML fragment is pure markup with no behaviour of its own; its
# .css/.js siblings are NOT covered by this rule and fall through to "full"
# below (the component-contract harnesses in tests/e2e/ assert those).
[[e2e.rule]]
tier       = "static"
prefix     = "app/webapp/static/_vendored/"
extensions = ["html"]

# Real browser surface -> full dual coverage.
[[e2e.rule]]
tier   = "full"
prefix = "app/webapp/"
[[e2e.rule]]
tier   = "full"
prefix = "app/tray/"
[[e2e.rule]]
tier   = "full"
prefix = "app/views/"
[[e2e.rule]]
tier   = "full"
prefix = "app/styles/"
[[e2e.rule]]
tier = "full"
path = "app/app.py"
# The e2e suite itself, and the Streamlit boot helper its conftest relies on.
[[e2e.rule]]
tier   = "full"
prefix = "tests/e2e/"
[[e2e.rule]]
tier = "full"
path = "tests/_streamlit_lifecycle.py"
# ...and the port-to-PID probe that boot helper (and _tray_harness.py) reclaims
# with -- a bad parse here breaks the e2e boot, so it must not route "none"
# just because it lives under tests/ (#208).
[[e2e.rule]]
tier = "full"
path = "tests/_port_probe.py"

# The usage-log router is the server the usage-log e2e drives (#349), so it is
# a browser surface despite living under src/. Must precede the src/ rule.
[[e2e.rule]]
tier = "full"
path = "src/usage_log.py"

# The screenshot-baseline comparison is proven by a browser test, so it is a
# browser surface despite living under scripts/. Must precede the scripts/ rule.
[[e2e.rule]]
tier = "full"
path = "scripts/shot_baseline.py"

# Backend/tooling with no browser impact -> no browser suite needed.
[[e2e.rule]]
tier       = "none"
prefix     = "src/"
extensions = ["py"]
[[e2e.rule]]
tier       = "none"
prefix     = "tests/"
extensions = ["py"]
# Synthetic adopter repos the generator tests parse (#412); a dotfile like
# .fleet.toml has no extension to match, so the whole folder is declared inert.
[[e2e.rule]]
tier   = "none"
prefix = "tests/_fixtures/"
[[e2e.rule]]
tier   = "none"
prefix = "scripts/"
[[e2e.rule]]
tier   = "none"
prefix = "config/"
[[e2e.rule]]
tier   = "none"
prefix = "docs/"
[[e2e.rule]]
tier   = "none"
prefix = ".github/"
[[e2e.rule]]
tier       = "none"
extensions = ["md"]
[[e2e.rule]]
tier = "none"
path = ".fleet.toml"
[[e2e.rule]]
tier = "none"
path = ".gitignore"
# The static-ratchet baseline is data for scripts/static_ratchet.py, not a browser
# surface; unlisted it would fail safe to the full suite (#410).
[[e2e.rule]]
tier = "none"
path = ".static-ratchet-baseline.json"
# Likewise the comment-ratchet baseline (#411).
[[e2e.rule]]
tier = "none"
path = ".comment-ratchet-baseline.json"
# Likewise the docs-ratchet baseline.
[[e2e.rule]]
tier = "none"
path = ".docs-ratchet-baseline.json"
# Likewise the structure-ratchet baseline.
[[e2e.rule]]
tier = "none"
path = ".structure-ratchet-baseline.json"
# Likewise the instruction-ratchet baseline.
[[e2e.rule]]
tier = "none"
path = ".instruction-ratchet-baseline.json"
# Likewise the doc-references-ratchet baseline.
[[e2e.rule]]
tier = "none"
path = ".doc-refs-ratchet-baseline.json"
# Likewise the dead-code-ratchet baseline.
[[e2e.rule]]
tier = "none"
path = ".dead-code-ratchet-baseline.json"
# Likewise the conventions-ratchet baseline.
[[e2e.rule]]
tier = "none"
path = ".conventions-ratchet-baseline.json"
[[e2e.rule]]
tier = "none"
path = "LICENSE"
[[e2e.rule]]
tier = "none"
path = "AGENTS.md"
[[e2e.rule]]
tier = "none"
path = "CLAUDE.md"
[[e2e.rule]]
tier       = "none"
extensions = ["bat"]

# Surfaces (#258): a diff that would route "full" but whose every full- or
# static-tier path sits in ONE surface below runs only that surface's
# pytest_targets. Anything shared stays OUT of every surface on purpose --
# conftest.py, _color_assertions.py, _nav_graft.py (the nav, row-menu and
# font-inherit harnesses' shared mount), demo.html (both vendored harnesses drive
# the gallery), icons/ (the nav harness renders the sprite), the Streamlit app
# -- so a change there keeps the whole suite. A path in two surfaces, or a diff
# spanning two, also keeps the whole suite. tests/test_classify_e2e.py pins
# these, including that every importer of a surface's helper is in its targets.
[[e2e.surface]]
name           = "nav"
prefixes       = ["app/webapp/static/_vendored/nav/"]
# The font-inherit harness also mounts the real nav (#319), and the row-menu
# placement harness lays out the real pill the menu fits against (#362), so a
# nav edit runs both.
paths          = ["tests/e2e/test_nav_offset.py", "tests/e2e/test_vendored_nav.py"]
pytest_targets = [
    "tests/e2e/test_nav_offset.py",
    "tests/e2e/test_vendored_font_inherit.py",
    "tests/e2e/test_vendored_nav.py",
    "tests/e2e/test_vendored_row_menu_placement.py",
]

# The gallery components. test_vendored_nav.py mounts on the same gallery
# page, so a component stylesheet can reach it -- both harnesses run. The
# row-menu placement harness loads row-menu.js by URL (#362/#373), so every
# component edit runs it too.
[[e2e.surface]]
name     = "components"
prefixes = [
    "app/webapp/static/_vendored/action-row/",
    "app/webapp/static/_vendored/base/",
    "app/webapp/static/_vendored/button/",
    "app/webapp/static/_vendored/card/",
    "app/webapp/static/_vendored/day-marks/",
    "app/webapp/static/_vendored/day-row/",
    "app/webapp/static/_vendored/disclosure/",
    "app/webapp/static/_vendored/empty-state/",
    "app/webapp/static/_vendored/home-head/",
    "app/webapp/static/_vendored/icon-button/",
    "app/webapp/static/_vendored/icon-tile/",
    "app/webapp/static/_vendored/modal/",
    "app/webapp/static/_vendored/page-foot/",
    "app/webapp/static/_vendored/range-tab/",
    "app/webapp/static/_vendored/rec-wave/",
    "app/webapp/static/_vendored/row-menu/",
    "app/webapp/static/_vendored/segmented/",
    "app/webapp/static/_vendored/select-native/",
    "app/webapp/static/_vendored/switch/",
    "app/webapp/static/_vendored/text-size/",
    "app/webapp/static/_vendored/toast/",
]
paths          = [
    "tests/e2e/test_vendored_components.py",
    "tests/e2e/test_vendored_day.py",
    "tests/e2e/test_vendored_font_inherit.py",
    "tests/e2e/test_vendored_home_head.py",
    "tests/e2e/test_vendored_rec_wave.py",
    "tests/e2e/test_vendored_row_menu.py",
]
pytest_targets = [
    "tests/e2e/test_vendored_components.py",
    "tests/e2e/test_vendored_day.py",
    "tests/e2e/test_vendored_font_inherit.py",
    "tests/e2e/test_vendored_home_head.py",
    "tests/e2e/test_vendored_nav.py",
    "tests/e2e/test_vendored_rec_wave.py",
    "tests/e2e/test_vendored_row_menu.py",
    "tests/e2e/test_vendored_row_menu_placement.py",
]

# The rendered-geometry helper and its hermetic fixtures. The component
# harness imports the helper for range-tab's touch targets (#267), and the
# nav harness for the pill's tap rectangles (#348), so an edit to
# _geometry.py runs both.
[[e2e.surface]]
name           = "geometry"
prefixes       = ["tests/e2e/_fixtures/geometry/"]
paths          = ["tests/e2e/_geometry.py", "tests/e2e/test_geometry_helper.py"]
pytest_targets = [
    "tests/e2e/test_geometry_helper.py",
    "tests/e2e/test_layout_lint.py",
    "tests/e2e/test_vendored_components.py",
    "tests/e2e/test_vendored_day.py",
    "tests/e2e/test_vendored_home_head.py",
    "tests/e2e/test_vendored_nav.py",
    "tests/e2e/test_vendored_row_menu.py",
]

# The layout lint and its broken/fixed fixture page. It imports _geometry.py
# (listed above) and _shot.py (whole suite), so those edits reach it too.
[[e2e.surface]]
name           = "layout-lint"
prefixes       = ["tests/e2e/_fixtures/layout/"]
paths          = ["tests/e2e/_layout_lint.py", "tests/e2e/test_layout_lint.py"]
pytest_targets = ["tests/e2e/test_layout_lint.py"]

# The usage log (#349): client module + server router, driven end to end by
# its own harness. The gallery loads the client in a separate module script,
# so a usage-log edit cannot stop the gallery's own script and needs no other
# harness; demo.html itself stays shared (whole suite).
[[e2e.surface]]
name           = "usage-log"
prefixes       = ["app/webapp/static/_vendored/usage-log/"]
paths          = ["src/usage_log.py", "tests/e2e/test_vendored_usage_log.py"]
pytest_targets = ["tests/e2e/test_vendored_usage_log.py"]

# The screenshot baseline: the comparison, its proof and the committed PNGs.
# The capture helper tests/e2e/_shot.py stays out: conftest imports it, so an
# edit there runs the whole suite.
[[e2e.surface]]
name           = "shot-baseline"
prefixes       = ["tests/e2e/shots/"]
paths          = ["scripts/shot_baseline.py", "tests/e2e/test_shot_capture.py"]
pytest_targets = ["tests/e2e/test_shot_capture.py"]

# ---------------------------------------------------------------------------
# Static-analysis ratchet (project-scaffolding#410). scripts/verify-before-ship.ps1
# runs scripts/static_ratchet.py, which fails only on a duplicated block (jscpd,
# Python + JS), an unused import/variable (ruff F401/F841) or a curated ruff
# bug/security pattern (B/S, `ruff_rules`) that is NEW relative to the committed
# baseline. Opt-in per repo through this table: absent or
# `enabled = false` is the declared "not enabled" skip, so re-vendoring the
# script never breaks an adopter. Procedure + limits: docs/static-ratchet.md.
# This scaffold owns the vendored copies, so it does not exclude `_vendored/`
# (an adopter does: its copies are duplicates by design).
# The ratchet scripts are the exception: each is stdlib-only and vendored on its
# own, so they cannot import a shared module and repeat their config, glob and
# git-listing helpers by contract. An adopter's `[vendored]` table excludes the
# same files; the general ruff stage still lints them.
[static_ratchet]
enabled = true
exclude = ["scripts/*_ratchet.py"]

# ---------------------------------------------------------------------------
# Comment ratchet (project-scaffolding#411). scripts/verify-before-ship.ps1 runs
# scripts/comment_ratchet.py, which fails when a file's count of `#NNN` issue
# references inside comments (Python, JS, CSS, PowerShell) rises above the
# committed baseline. Opt-in per repo through this table, like [static_ratchet].
# The rule text is fleet-config#1517; procedure + limits: docs/comment-ratchet.md.
# This scaffold owns the vendored copies, so it does not exclude `_vendored/`
# (an adopter's `[vendored]` table excludes its copies automatically).
[comment_ratchet]
enabled = true

# ---------------------------------------------------------------------------
# Docs ratchet. scripts/verify-before-ship.ps1 runs scripts/docs_ratchet.py,
# which fails when the root README grows past its byte budget (40 KiB unless
# `readme_max_bytes` says otherwise) or when a file's count of history markers
# (issue references, dated headings, changelog headings) in README.md and
# docs/**/*.md rises above the committed baseline. Opt-in per repo through this
# table, like [comment_ratchet]. Convention: docs/readme-and-docs.md;
# mechanism + limits: docs/docs-ratchet.md.
# docs/agents/CLAUDE.master.md is the byte mirror of CLAUDE.md (an instruction
# file, outside this ratchet's scope), so its decision-record references are
# excluded with it; tests/test_claude_master_sync.py keeps the two identical.
# `allow_refs` keeps the one canonical-issue link brand-icons.md opens with.
[docs_ratchet]
enabled    = true
exclude    = ["docs/agents/CLAUDE.master.md"]
allow_refs = ["app-launcher#65"]

# ---------------------------------------------------------------------------
# Structure ratchet. scripts/verify-before-ship.ps1 runs
# scripts/structure_ratchet.py, which fails when a file passes 1,000 lines, a
# Python or JS function passes 100 lines, a directory passes 40 modules, or a
# src/ module imports app/, beyond the committed baseline. Opt-in per repo
# through this table, like [docs_ratchet]; the defaults are the limits in
# docs/repo-layout.md; `near_limit_ratio` (default 0.9) sets the shrink-only
# near-limit band. Mechanism + limits: docs/structure-ratchet.md.
[structure_ratchet]
enabled = true

# ---------------------------------------------------------------------------
# Instruction ratchet. scripts/verify-before-ship.ps1 runs
# scripts/instruction_ratchet.py, which fails when an instruction file
# (CLAUDE.md, AGENTS.md, .claude/rules/*.md, a SKILL.md or a doc a skill
# references) gains a hit of one of the prompt audit's deterministic lint rules,
# or passes its size cap, beyond the committed baseline. Opt-in per repo through
# this table, like [structure_ratchet]; `skill_dirs` and `extra_files` widen the
# scope. Mechanism + limits: docs/instruction-ratchet.md.
[instruction_ratchet]
enabled = true

# ---------------------------------------------------------------------------
# Doc references ratchet. scripts/verify-before-ship.ps1 runs
# scripts/doc_refs_ratchet.py, which fails when README.md, CLAUDE.md or
# docs/**/*.md names a repo path, `python -m` module or loopback port that does
# not exist (a port is checked against `port` above, when declared), beyond the
# committed baseline. Opt-in per repo through this table, like
# [instruction_ratchet]. `allow_refs` lists intentional pointers: here, the files
# an adopter creates from the scaffold's templates and instructions.
# Mechanism + limits: docs/doc-refs-ratchet.md.
[doc_refs_ratchet]
enabled    = true
allow_refs = [
    "docs/layout.md",
    ".github/workflows/ci.yml",
    ".github/workflows/main-gate-watch.yml",
    "scripts/gen_icons.py",
    "scripts/gen_ssl_cert.py",
]

# ---------------------------------------------------------------------------
# Dead code ratchet. scripts/verify-before-ship.ps1 runs
# scripts/dead_code_ratchet.py, which fails when a tracked Python file gains a
# function, class or method nothing references (route handlers, `__all__`,
# tests, hooks and the published API of [components] below are entry points),
# beyond the committed baseline. Opt-in per repo through this table, like
# [doc_refs_ratchet]. `allow` names the two functions adopters call from their
# own tree: the scaffold never calls them itself.
# Mechanism + limits: docs/dead-code-ratchet.md.
[dead_code_ratchet]
enabled = true
allow   = [
    "app/log_panel.py:render_log_panel",
    "scripts/brand_gen.py:render_set",
]

# ---------------------------------------------------------------------------
# Conventions ratchet. scripts/verify-before-ship.ps1 runs
# scripts/conventions_ratchet.py, which fails when a tracked Python file gains a
# hit of one of the listed fleet-convention rules (a spawn without the no-window
# flag, a print in app code, a hardcoded drive path, a raw secret compare outside
# `secret_helpers`, a raw git spawn outside `git_wrappers`), beyond the committed
# baseline. Opt-in per repo and per rule through this table, like
# [dead_code_ratchet]. The scaffold has no secret-compare helper or git wrapper,
# so it enforces the three rules that need none.
# Mechanism + limits: docs/conventions-ratchet.md.
[conventions_ratchet]
enabled = true
rules   = ["no-window", "logging-not-print", "no-drive-path"]

# ---------------------------------------------------------------------------
# Screenshot baseline. scripts/verify-before-ship.ps1 runs
# scripts/shot_baseline.py after the e2e stage: it compares the screenshots the
# run recaptured (tests/e2e/_shot.py: phone + desktop, light + dark) with the
# committed PNGs under `shots_dir`, fails on any visible change, then restores
# the tree. Opt-in per repo through this table, like [structure_ratchet];
# `capture` is the argv after the interpreter that the --baseline and two-run
# modes run. Contract + re-baseline steps: docs/playwright-ui-testing.md
# ("Screenshot baseline").
[shot_baseline]
enabled   = true
shots_dir = "tests/e2e/shots"
capture   = ["-m", "pytest", "tests/e2e/test_shot_capture.py::test_gallery_shots", "-q", "-p", "no:cacheprovider"]

# ---------------------------------------------------------------------------
# [components] -- the canonical catalog of this scaffold's vendor-verbatim
# components. ONLY project-scaffolding carries this table; an adopter
# repo records what it copied in its own `[vendored]` table instead.
#
# Why it exists: `/propagate-vendored <component>` builds its adopter list from
# the adopters' `[vendored]` entries, so a repo that carries a component on disk
# but never declared it is invisible to the wave -- the fan-out re-vendors the
# repos that declared it, reports success, and leaves the undeclared carriers on
# the stale bytes with nobody told. This table is the missing half: the key ->
# source-path map that lets `vendored_drift.py` hash every fleet repo's copy of
# a KNOWN component path and name the repos carrying one they don't declare.
#
# Contract:
#   * `src` is the path in THIS repo. An adopter's default destination is the
#     same relative path (an adopter that puts it elsewhere declares `dest` in
#     its own `[vendored]` entry, and is found by that entry rather than here).
#   * The key is the manifest key adopters use -- changing one orphans every
#     adopter's entry, so treat these as stable identifiers.
#   * Add a component here in the SAME PR that adds it to the tree.
#     `tests/test_vendored_catalog.py` fails otherwise, and
#     `scripts/verify-before-ship.ps1` derives its `mypy --strict` gate list
#     from this table -- one catalog, not three hand-maintained lists.
#   * Copy-to-adapt templates (`tray.bat.template`,
#     `.github/workflows/main-gate-watch.yml.template`, `scripts/gen_tailscale_cert.py`)
#     are deliberately ABSENT: they are edited on arrival, so byte-identity
#     never holds and an "undeclared carrier" finding over them would be pure
#     noise.
[components]
# Web-app UI components (app/webapp/static/_vendored/) -- see that dir's README.
base            = { src = "app/webapp/static/_vendored/base" }
nav             = { src = "app/webapp/static/_vendored/nav" }
icons           = { src = "app/webapp/static/_vendored/icons" }
card            = { src = "app/webapp/static/_vendored/card" }
button          = { src = "app/webapp/static/_vendored/button" }
modal           = { src = "app/webapp/static/_vendored/modal" }
disclosure      = { src = "app/webapp/static/_vendored/disclosure" }
empty-state     = { src = "app/webapp/static/_vendored/empty-state" }
select-native   = { src = "app/webapp/static/_vendored/select-native" }
switch          = { src = "app/webapp/static/_vendored/switch" }
icon-tile       = { src = "app/webapp/static/_vendored/icon-tile" }
range-tab       = { src = "app/webapp/static/_vendored/range-tab" }
segmented       = { src = "app/webapp/static/_vendored/segmented" }
home-head       = { src = "app/webapp/static/_vendored/home-head" }
page-foot       = { src = "app/webapp/static/_vendored/page-foot" }
action-row      = { src = "app/webapp/static/_vendored/action-row" }
text-size       = { src = "app/webapp/static/_vendored/text-size" }
toast           = { src = "app/webapp/static/_vendored/toast" }
rec-wave        = { src = "app/webapp/static/_vendored/rec-wave" }
row-menu        = { src = "app/webapp/static/_vendored/row-menu" }
icon-button     = { src = "app/webapp/static/_vendored/icon-button" }
# The date-keyed row (an action-row led by a date tile) and the day marks (#350).
day-row         = { src = "app/webapp/static/_vendored/day-row" }
day-marks       = { src = "app/webapp/static/_vendored/day-marks" }
# The usage log's client half; its server half is `usage_log` below (#349).
usage-log       = { src = "app/webapp/static/_vendored/usage-log" }

# Windows tray primitives -- docs/windows-tray.md (gotchas #4, #5).
single_instance = { src = "app/tray/single_instance.py" }
tray_watchdog   = { src = "app/tray/watchdog.py" }

# e2e harness primitives -- docs/playwright-ui-testing.md.
geometry        = { src = "tests/e2e/_geometry.py" }
e2e_live_guard  = { src = "tests/e2e/_e2e_live_guard.py" }
browser_sweep   = { src = "tests/e2e/_browser_sweep.py" }
# The design-surface capture hook; conftest imports its collection hook (#408).
surface_capture = { src = "tests/e2e/_surface.py" }
# The screenshot baseline's capture half; its comparison is `shot_baseline` below.
