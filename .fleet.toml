# .fleet.toml — this repo's card on the fleet architecture map.
# fleet-config's /system-map aggregates every repo's .fleet.toml (schema +
# reasoning: fleet-config/architecture/README.md). Keep it current: update this
# in the same PR as any material change (layer, port, role, one-line description,
# exposed services).
#
# CLONED A NEW REPO FROM THIS SCAFFOLD? Replace the values below with your repo's
# own — at minimum `description`, usually `icon`, and `layer` if it is not a
# pipeline (working-pipe). `layer` ∈ governance | enabling | working-web | working-pipe.
layer       = "governance"
icon        = "📐"
description = "Canonical master — the scaffold &amp; CLAUDE.md every project derives from."

# Diff-proportionate e2e routing (project-scaffolding#180). scripts/verify-
# before-ship.ps1's browser phase classifies the branch's changed files
# against the rules below (first match wins, in this order) instead of
# always running the whole tests/e2e suite. Schema + rationale:
# docs/e2e-routing.md. Mechanism: scripts/classify_e2e.py. A path matching no
# rule below -- or a repo with no [e2e] table at all -- fails safe to the
# full suite; this table only ever narrows what an *already-covered* diff
# runs, never what an unmatched one runs.
[e2e]
static_pytest_target = "tests/e2e/test_smoke.py"
static_browsers       = ["chromium"]
full_pytest_target    = "tests/e2e"

# Inert image/font assets under the vendored static tree -> smoke is enough.
[[e2e.rule]]
tier       = "static"
prefix     = "app/webapp/static/"
extensions = ["svg", "png", "jpg", "jpeg", "gif", "ico", "webp", "avif", "woff", "woff2", "ttf", "eot", "otf", "webmanifest"]

# A vendored HTML fragment is pure markup with no behaviour of its own; its
# .css/.js siblings are NOT covered by this rule and fall through to "full"
# below (the component-contract harnesses in tests/e2e/ assert those).
[[e2e.rule]]
tier       = "static"
prefix     = "app/webapp/static/_vendored/"
extensions = ["html"]

# Real browser surface -> full dual coverage.
[[e2e.rule]]
tier   = "full"
prefix = "app/webapp/"
[[e2e.rule]]
tier   = "full"
prefix = "app/tray/"
[[e2e.rule]]
tier   = "full"
prefix = "app/views/"
[[e2e.rule]]
tier   = "full"
prefix = "app/styles/"
[[e2e.rule]]
tier = "full"
path = "app/app.py"
# The e2e suite itself, and the Streamlit boot helper its conftest relies on.
[[e2e.rule]]
tier   = "full"
prefix = "tests/e2e/"
[[e2e.rule]]
tier = "full"
path = "tests/_streamlit_lifecycle.py"
# ...and the port-to-PID probe that boot helper (and _tray_harness.py) reclaims
# with -- a bad parse here breaks the e2e boot, so it must not route "none"
# just because it lives under tests/ (#208).
[[e2e.rule]]
tier = "full"
path = "tests/_port_probe.py"

# Backend/tooling with no browser impact -> no browser suite needed.
[[e2e.rule]]
tier       = "none"
prefix     = "src/"
extensions = ["py"]
[[e2e.rule]]
tier       = "none"
prefix     = "tests/"
extensions = ["py"]
[[e2e.rule]]
tier   = "none"
prefix = "scripts/"
[[e2e.rule]]
tier   = "none"
prefix = "config/"
[[e2e.rule]]
tier   = "none"
prefix = "docs/"
[[e2e.rule]]
tier   = "none"
prefix = ".github/"
[[e2e.rule]]
tier       = "none"
extensions = ["md"]
[[e2e.rule]]
tier = "none"
path = ".fleet.toml"
[[e2e.rule]]
tier = "none"
path = ".gitignore"
[[e2e.rule]]
tier = "none"
path = "LICENSE"
[[e2e.rule]]
tier = "none"
path = "AGENTS.md"
[[e2e.rule]]
tier = "none"
path = "CLAUDE.md"
[[e2e.rule]]
tier       = "none"
extensions = ["bat"]

# ---------------------------------------------------------------------------
# [components] -- the canonical catalog of this scaffold's vendor-verbatim
# components (#230). ONLY project-scaffolding carries this table; an adopter
# repo records what it copied in its own `[vendored]` table instead.
#
# Why it exists: `/propagate-vendored <component>` builds its adopter list from
# the adopters' `[vendored]` entries, so a repo that carries a component on disk
# but never declared it is invisible to the wave -- the fan-out re-vendors the
# repos that declared it, reports success, and leaves the undeclared carriers on
# the stale bytes with nobody told (#228 shipped a fix to one repo out of seven
# exactly that way). This table is the missing half: the key -> source-path map
# that lets `vendored_drift.py` hash every fleet repo's copy of a KNOWN component
# path and name the repos carrying one they don't declare.
#
# Contract:
#   * `src` is the path in THIS repo. An adopter's default destination is the
#     same relative path (an adopter that puts it elsewhere declares `dest` in
#     its own `[vendored]` entry, and is found by that entry rather than here).
#   * The key is the manifest key adopters use -- changing one orphans every
#     adopter's entry, so treat these as stable identifiers.
#   * Add a component here in the SAME PR that adds it to the tree.
#     `tests/test_vendored_catalog.py` fails otherwise, and
#     `scripts/verify-before-ship.ps1` derives its `mypy --strict` gate list
#     from this table -- one catalog, not three hand-maintained lists.
#   * Copy-to-adapt templates (`tray.bat.template`,
#     `.github/workflows/main-gate-watch.yml.template`, `scripts/gen_tailscale_cert.py`)
#     are deliberately ABSENT: they are edited on arrival, so byte-identity
#     never holds and an "undeclared carrier" finding over them would be pure
#     noise. `gen_tailscale_cert.py` was reclassified out of this table in #232:
#     every real adopter had already adapted it (its own `NO_WINDOW` import,
#     `grocery-shopping-automation`'s different `CERT_DIR`), so "verbatim" never
#     held in practice.
[components]
# Web-app UI components (app/webapp/static/_vendored/) -- see that dir's README.
nav             = { src = "app/webapp/static/_vendored/nav" }
icons           = { src = "app/webapp/static/_vendored/icons" }
card            = { src = "app/webapp/static/_vendored/card" }
button          = { src = "app/webapp/static/_vendored/button" }
modal           = { src = "app/webapp/static/_vendored/modal" }
disclosure      = { src = "app/webapp/static/_vendored/disclosure" }
empty-state     = { src = "app/webapp/static/_vendored/empty-state" }
select-native   = { src = "app/webapp/static/_vendored/select-native" }
switch          = { src = "app/webapp/static/_vendored/switch" }
icon-tile       = { src = "app/webapp/static/_vendored/icon-tile" }
range-tab       = { src = "app/webapp/static/_vendored/range-tab" }
home-head       = { src = "app/webapp/static/_vendored/home-head" }
page-foot       = { src = "app/webapp/static/_vendored/page-foot" }

# Windows tray primitives -- docs/windows-tray.md (gotchas #4, #5).
single_instance = { src = "app/tray/single_instance.py" }
tray_watchdog   = { src = "app/tray/watchdog.py" }

# e2e harness primitives -- docs/playwright-ui-testing.md.
geometry        = { src = "tests/e2e/_geometry.py" }
e2e_live_guard  = { src = "tests/e2e/_e2e_live_guard.py" }
browser_sweep   = { src = "tests/e2e/_browser_sweep.py" }

# Scripts + library modules copied byte-for-byte into adopters.
classify_e2e    = { src = "scripts/classify_e2e.py" }
pooled_http     = { src = "src/pooled_http.py" }
no_window       = { src = "src/no_window.py" }
runtime_data    = { src = "src/runtime_data.py" }
notify          = { src = "src/notify" }
doc_capture     = { src = "src/doc_capture" }
build_info      = { src = "src/build_info.py" }
