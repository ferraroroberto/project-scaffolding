<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Surface fixture</title>
  <!--
    Hermetic fixture for tests/e2e/_surface.py (issue #408): a static page whose
    theme follows prefers-color-scheme, or an explicit data-theme attribute when
    one is set (the "explicit toggle" shape). Invented content only.
  -->
  <style>
    :root { --bg: #ffffff; --ink: #111111; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) { --bg: #0d1117; --ink: #eeeeee; }
    }
    :root[data-theme="dark"] { --bg: #0d1117; --ink: #eeeeee; }
    :root[data-theme="light"] { --bg: #ffffff; --ink: #111111; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.4 sans-serif; }
    main { padding: 16px; }
    #sheet { margin-top: 12px; padding: 12px; border: 1px solid currentColor; }
    button { font: inherit; padding: 8px 12px; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Jobs</h1>
    <div id="sheet" role="dialog" aria-label="Sort">
      <button id="sort" type="button">Sort by name</button>
      <button id="close" type="button">Close</button>
    </div>
  </main>
</body>
</html>
